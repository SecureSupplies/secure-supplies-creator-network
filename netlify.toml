# Secure Supplies Creator Partner Network — Netlify configuration

[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Scheduled functions (require a Git-connected or CLI deployment; not available on Netlify Drop)
[functions."scheduled-member-sync"]
  schedule = "@daily"

[functions."scheduled-commission-finalize"]
  schedule = "@daily"

# SPA fallback — all client routes served by index.html
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
